<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>화학식 퀴즈 (입력창 포커스 유지 및 정지 방지)</title>
    <style>
        body {
            margin: 0; padding: 0;
            background: #f4f7f6;
            font-family: 'Malgun Gothic', sans-serif;
            display: flex; flex-direction: column;
            align-items: center; height: 100vh;
            overflow: hidden;
            touch-action: manipulation; /* 더블탭 확대 방지 */
        }

        header {
            width: 100%; padding: 15px;
            text-align: center; background: #fff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            user-select: none;
        }
        #score-board { font-size: 1.1rem; font-weight: bold; color: #2c3e50; }

        #quiz-container {
            flex: 1; display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            width: 90%; max-width: 600px;
            user-select: none;
        }
        #formula-display {
            font-size: 4.5rem; font-weight: bold;
            margin-bottom: 20px; color: #3498db;
        }
        #feedback { height: 40px; font-size: 1.3rem; font-weight: bold; }

        #input-area {
            width: 100%; padding: 20px;
            background: #fff; border-top: 1px solid #ddd;
            text-align: center;
        }
        input {
            width: 85%; max-width: 400px;
            padding: 15px; font-size: 1.5rem;
            border: 3px solid #3498db; border-radius: 10px;
            text-align: center; outline: none;
        }
        
        /* 결과 및 오답 화면 */
        #final-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: white; display: none;
            flex-direction: column; align-items: center;
            z-index: 100; padding: 20px; overflow-y: auto;
        }
        #report-container {
            width: 100%; max-width: 500px;
            margin: 20px 0;
        }
        .report-item {
            padding: 12px; border-bottom: 1px solid #eee;
            display: flex; justify-content: space-between; align-items: center;
            background-color: #fff1f1; margin-bottom: 5px; border-radius: 5px;
        }
        .correct-text { color: #2ecc71; font-weight: bold; }
        .wrong-text { color: #e74c3c; font-weight: bold; }

        .btn-group { display: flex; gap: 10px; margin-top: 20px; margin-bottom: 50px; }
        button {
            padding: 15px 25px; font-size: 1.1rem; cursor: pointer;
            border: none; border-radius: 10px; font-weight: bold;
        }
        .retry-btn { background: #e67e22; color: white; }
        .reload-btn { background: #95a5a6; color: white; }

        .correct { color: #2ecc71; }
        .incorrect { color: #e74c3c; }
        sub { font-size: 0.6em; vertical-align: sub; }
    </style>
</head>
<body>

    <header>
        <div id="score-board">
            <span id="mode-text">전체 문제</span>: <span id="current-idx">1</span> / <span id="total-count">19</span> | 
            점수: <span id="score">0</span>
        </div>
    </header>

    <div id="quiz-container">
        <div id="formula-display"></div>
        <div id="feedback"></div>
    </div>

    <div id="input-area">
        <input type="text" id="answer-input" placeholder="이름 입력 후 엔터" autocomplete="off" autofocus>
    </div>

    <div id="final-screen">
        <h1 id="result-title">퀴즈 종료!</h1>
        <h2 id="final-score"></h2>
        
        <div id="report-container">
            <h3 id="report-title" style="text-align:center; border-bottom: 2px solid #333; padding-bottom: 10px;">오답 확인</h3>
            <div id="wrong-list"></div>
        </div>

        <div class="btn-group">
            <button id="re-challenge-btn" class="retry-btn" onclick="startRetry()">틀린 문제 다시 풀기</button>
            <button class="reload-btn" onclick="confirmReload()">처음부터 시작</button>
        </div>
    </div>

    <script>
        const initialData = [
            { formula: "O<sub>2</sub>", name: "산소" }, { formula: "N<sub>2</sub>", name: "질소" },
            { formula: "H<sub>2</sub>", name: "수소" }, { formula: "H<sub>2</sub>O", name: "물" },
            { formula: "CO", name: "일산화탄소" }, { formula: "CO<sub>2</sub>", name: "이산화탄소" },
            { formula: "HCl", name: "염화수소" }, { formula: "NH<sub>3</sub>", name: "암모니아" },
            { formula: "CH<sub>4</sub>", name: "메테인" }, { formula: "NaCl", name: "염화나트륨" },
            { formula: "AgNO<sub>3</sub>", name: "질산은" }, { formula: "NaNO<sub>3</sub>", name: "질산나트륨" },
            { formula: "Na<sub>2</sub>CO<sub>3</sub>", name: "탄산나트륨" }, { formula: "CaCl<sub>2</sub>", name: "염화칼슘" },
            { formula: "AgCl", name: "염화은" }, { formula: "PbI<sub>2</sub>", name: "아이오딘화납" },
            { formula: "CaCO<sub>3</sub>", name: "탄산칼슘" }, { formula: "BaSO<sub>4</sub>", name: "황산바륨" },
            { formula: "H<sub>2</sub>O<sub>2</sub>", name: "과산화수소" }
        ];

        let currentQuestions = [...initialData].sort(() => Math.random() - 0.5);
        let wrongQuestions = []; 
        let currentIdx = 0;
        let score = 0;
        let isProcessing = false; // 연속 입력으로 인한 버그 방지 플래그

        const formulaDisplay = document.getElementById('formula-display');
        const answerInput = document.getElementById('answer-input');
        const feedback = document.getElementById('feedback');
        const scoreElement = document.getElementById('score');
        const currentIdxElement = document.getElementById('current-idx');
        const totalCountElement = document.getElementById('total-count');
        const modeText = document.getElementById('mode-text');

        // [핵심 수정] 화면의 빈 곳을 터치해도 게임이 오작동하지 않고 입력창에 포커스를 유지하게 만듦
        document.addEventListener('click', (e) => {
            // 클릭된 요소가 input창이 아니고 결과창이 열려있지 않다면 input창으로 포커스 강제 이동
            if (e.target !== answerInput && document.getElementById('final-screen').style.display !== 'flex') {
                answerInput.focus();
            }
        });

        function loadQuiz() {
            if (currentIdx >= currentQuestions.length) {
                showResult();
                return;
            }
            isProcessing = false;
            totalCountElement.innerText = currentQuestions.length;
            formulaDisplay.innerHTML = currentQuestions[currentIdx].formula;
            answerInput.value = "";
            feedback.innerText = "";
            currentIdxElement.innerText = currentIdx + 1;
            answerInput.focus();
        }

        function checkAnswer() {
            if (isProcessing) return; // 이미 채점 중이면 중복 실행 차단
            isProcessing = true;

            const rawUserAnswer = answerInput.value;
            const userAnswer = rawUserAnswer.replace(/\s+/g, ""); 
            const correctAnswer = currentQuestions[currentIdx].name.replace(/\s+/g, ""); 
            const isCorrect = userAnswer === correctAnswer;

            if (isCorrect) {
                score++;
                scoreElement.innerText = score;
                feedback.innerText = "정답입니다! 👍";
                feedback.className = "correct";
            } else {
                feedback.innerText = `오답! 정답: ${currentQuestions[currentIdx].name}`;
                feedback.className = "incorrect";
                if(!wrongQuestions.find(q => q.formula === currentQuestions[currentIdx].formula)) {
                    wrongQuestions.push(currentQuestions[currentIdx]);
                }
            }

            currentIdx++;
            setTimeout(loadQuiz, 1000);
        }

        answerInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && answerInput.value.trim() !== "") {
                checkAnswer();
            }
        });

        function showResult() {
            document.getElementById('final-screen').style.display = 'flex';
            document.getElementById('final-score').innerText = `점수: ${score} / ${currentQuestions.length}`;
            
            const wrongList = document.getElementById('wrong-list');
            const retryBtn = document.getElementById('re-challenge-btn');
            wrongList.innerHTML = "";

            if (wrongQuestions.length === 0) {
                document.getElementById('report-title').innerText = "완벽합니다! 🎉";
                wrongList.innerHTML = "<p style='text-align:center;'>모든 문제를 마스터하셨습니다.</p>";
                retryBtn.style.display = 'none';
            } else {
                document.getElementById('report-title').innerText = "오답 노트";
                retryBtn.style.display = 'block';
                wrongQuestions.forEach(item => {
                    const div = document.createElement('div');
                    div.className = "report-item";
                    div.innerHTML = `<span><strong>${item.formula}</strong></span> <span class="correct-text">${item.name}</span>`;
                    wrongList.appendChild(div);
                });
            }
        }

        function startRetry() {
            currentQuestions = [...wrongQuestions].sort(() => Math.random() - 0.5);
            wrongQuestions = []; 
            currentIdx = 0;
            score = 0;
            
            modeText.innerText = "오답 재도전";
            scoreElement.innerText = "0";
            document.getElementById('final-screen').style.display = 'none';
            
            loadQuiz();
        }

        // [핵심 수정] 취소를 누르면 정지하지 않고 게임 상태 유지, 확인을 누를 때만 새로고침(초기화)
        function confirmReload() {
            if (confirm("정말 처음부터 다시 시작하시겠습니까?")) {
                location.reload(); // 확인을 누르면 리로드하여 초기화
            }
            // 취소를 누르면 아무 일도 일어나지 않고 원래 결과 화면을 유지합니다.
        }

        loadQuiz();
    </script>
</body>
</html>
